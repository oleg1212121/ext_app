# Defense-in-depth rate limit for AI endpoints (primary control is the Laravel
# throttle:20,1 in routes/web.php). ~10 req/min per IP with a short burst.
# Declared at http context (conf.d/*.conf is included inside http {}).
limit_req_zone $binary_remote_addr zone=ai:10m rate=10r/m;

server {
    listen 80;
    index index.php index.html;
    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
    root /var/www/public;

    # Allow real book uploads via ProcessEntityFile (default 1MB would 413).
    client_max_body_size 20m;

    # Basic security headers (applied to all responses incl. errors via `always`).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # AI question endpoints — extra nginx-level throttle before PHP runs.
    location ~ ^/ai/question {
        limit_req zone=ai burst=10 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        fastcgi_pass app:9000;
        fastcgi_read_timeout 300s;
        fastcgi_connect_timeout 75s;
        fastcgi_send_timeout 300s;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        send_timeout 600s;
    }
}
