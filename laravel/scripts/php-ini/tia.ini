; Loaded via PHP_INI_SCAN_DIR in composer.json's test:tia script. Pest runs
; parallel through the paratest binary, whose worker processes do not inherit
; `php -d` ini flags from the parent invocation — environment-propagated ini
; scanning is the only way these settings reach every worker. This file loads
; only the coverage driver; the test-process memory limit lives in
; phpunit.xml's <ini name="memory_limit"> pin, which outranks any memory line
; here (PHPUnit's config-load ini_set beats startup ini files in every
; process that loads the config).
extension=pcov.so
pcov.enabled=1
