name: Deploy (prod)

# Autodeploy: on push to master, the self-hosted runner on the prod machine
# (labels: self-hosted, prod) runs deploy-native.sh against the real checkout.
# No actions/checkout on purpose — the app processes run straight from the
# checkout mount, so a runner-workspace clone would deploy nothing.
#
# deploy-native.sh is the native (no-Docker) release flow: git pull, composer
# install, npm build, caches, additive migrate, idempotent seeds, then restarts
# the queue/scheduler units. A red run means the deploy aborted midway — fix on
# the prod machine and re-run this workflow (workflow_dispatch).
#
# NEVER add pull_request to this trigger: fork/PR code must never execute on
# the prod self-hosted runner.
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false # queue pushes; never cancel a running deploy

env:
  # Absolute path of the prod checkout (native Ubuntu server — no Docker here).
  PROD_CHECKOUT: /home/alex/projects/ext_app

jobs:
  deploy:
    runs-on: [self-hosted, prod]
    timeout-minutes: 30
    steps:
      - name: Deploy
        run: bash "$PROD_CHECKOUT/deploy-native.sh"
