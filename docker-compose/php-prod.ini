; Production PHP settings for the ext_app prod image (LaravelDockerfile.prod).
; Mounted into ${PHP_INI_DIR}/conf.d by the image build.

upload_max_filesize = 20M
post_max_size = 25M

; OPcache — validate_timestamps=0 in prod (files don't change post-build).
opcache.enable = 1
opcache.enable_cli = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.revalidate_freq = 60
