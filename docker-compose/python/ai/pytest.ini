[pytest]
# Python ML service test suite. Canonical run (inside the container):
#   docker exec ext_python python -m pytest /app/ai -q
testpaths = .
pythonpath = ..
addopts = -ra --strict-markers
markers =
    silero: needs the silero-stress package and its accentor data
    spacy: needs the spaCy en_core_web_md model
