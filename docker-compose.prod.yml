# Production overlay for the STANDALONE production machine (bind-mount model).
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#     --profile cloudflare up -d
#
# Unlike the old baked-image overlay (2026-08-26..30, git history), code is NOT
# baked into images: app/queue/scheduler run the dev runtime image
# (eng_ext_laravel) with ./laravel bind-mounted. Shipping code is ./deploy.sh
# (git pull + composer + npm build + caches + additive migrate inside the
# running containers); images rebuild ONLY when a Dockerfile changes
# (docker compose -f docker-compose.yml -f docker-compose.prod.yml build app).
#
# db is identical to the old overlay (creds from postgres.env, PGDATA at
# ./docker-compose/prod/postgres) so the existing cluster is found and never
# re-initialized — deploys apply pending migrations only, nothing destructive.
#
# Env is a single source: laravel/.env on disk (bind-mounted, no env_file on
# app/queue/scheduler). On the prod machine it is a copy of .env.production
# (one-time switchover step; DB_* must match docker-compose/prod/postgres.env).
#
# Secrets (all gitignored, live on the prod machine):
#   - laravel/.env                     app + queue + scheduler env
#   - docker-compose/prod/postgres.env POSTGRES_* for db + backups
#   - docker-compose/cloudflare/.env   TUNNEL_TOKEN
#
# `!override` / `!reset` are Compose v2.24+ merge tags.

services:

  # --- Laravel app (PHP-FPM): base service untouched — eng_ext_laravel image,
  # ./laravel + ./ bind mounts, env from laravel/.env on disk. Only prod
  # guards/limits are added here. ---
  app:
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 1g
    cpus: '2'

  # --- Postgres: UNCHANGED from the old overlay so the prod machine's
  # existing cluster is found untouched (no recreation on switchover). ---
  db:
    image: postgres:18-alpine
    env_file: !override
      - ./docker-compose/prod/postgres.env
    # Clear the dev environment map (which interpolated test/test defaults) —
    # POSTGRES_* now come from postgres.env via env_file.
    environment: !override { PGDATA: /var/lib/postgresql/data }
    ports: !reset null
    volumes: !override
      # Host bind mount (NOT a named volume) so the cluster survives Docker
      # "Purge data" wipes of Docker-managed volumes. PGDATA pinned explicitly.
      - ./docker-compose/prod/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    mem_limit: 2g
    cpus: '2'

  # --- nginx: no volume override — the base mounts (./laravel + ./nginx/conf)
  # serve the bind-mounted checkout; deploy.sh keeps public/build fresh. ---
  nginx:
    depends_on:
      - app
    restart: unless-stopped
    mem_limit: 128m
    cpus: '0.5'

  # --- Python ML service (prod toggles: 2 workers, no host port). ---
  python:
    command: uvicorn ai.main:app --host 0.0.0.0 --port 8000 --workers 2
    ports: !reset null
    restart: unless-stopped
    mem_limit: 5g
    cpus: '4'

  # --- cloudflared: re-gated behind the profile (explicit -f files skip
  # docker-compose.override.yml, which gates it on the dev machine). ---
  cloudflared:
    profiles:
      - cloudflare

  # --- Queue workers (2 replicas, bind-mounted source, no baked image).
  # The dev image has no ENTRYPOINT, so a plain command override suffices.
  # deploy.sh's `queue:restart` recycles them onto new code per release. ---
  queue:
    image: eng_ext_laravel
    # Wait for migrations (run by deploy.sh / first boot) before consuming.
    command: >-
      sh -c "until php artisan migrate:status >/dev/null 2>&1; do sleep 2; done
      && exec php artisan queue:work --tries=1 --timeout=620"
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
    volumes:
      - ./laravel:/var/www
    networks:
      - ext_net
    restart: unless-stopped
    scale: 2
    mem_limit: 1g
    cpus: '1.5'

  # --- Scheduler (single; schedule:work daemon for every-minute ticks —
  # drives alignments:resume ->withoutOverlapping()). ---
  scheduler:
    image: eng_ext_laravel
    command: >-
      sh -c "until php artisan migrate:status >/dev/null 2>&1; do sleep 2; done
      && exec php artisan schedule:work"
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
    volumes:
      - ./laravel:/var/www
    networks:
      - ext_net
    restart: unless-stopped
    mem_limit: 256m
    cpus: '0.5'

  # --- Postgres daily backup sidecar (crond, 14-day retention). ---
  backups:
    image: postgres:18-alpine
    env_file: ./docker-compose/prod/postgres.env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "crond -l 2 -f"
    volumes:
      - ./docker-compose/prod/backups:/backups
      - ./docker-compose/prod/backup.sh:/etc/cron/backup.sh:ro
      - ./docker-compose/prod/backup.crontab:/etc/crontabs/root:ro
    networks:
      - ext_net
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 256m
    cpus: '0.5'
