services:

  app:
    build:
      args:
        user: alex
        uid: 1000
      context: .
      dockerfile: LaravelDockerfile
    image: eng_ext_laravel
    container_name: ext_app_laravel
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
        PHP_IDE_CONFIG: "serverName=Docker"
    restart: unless-stopped
    working_dir: /var/www/
    volumes:
      - type: bind
        source: ./laravel
        target: /var/www
        consistency: cached
      # Repo root (wiki/, AGENTS.md, docker-compose/) for wiki:sync / wiki:validate
      - type: bind
        source: ./
        target: /var/repo
        consistency: cached
      # - ./:/var/www
    networks:
      - ext_net



  db:
    image: postgres:18-alpine
    container_name: ext_pgdb
    restart: unless-stopped
    env_file:
      - ./laravel/.env
    ports:
      - "54321:5432"
    environment:
      SERVICE_TAGS: dev
      SERVICE_NAME: postgres
      PGDATA: /var/lib/postgresql/data
      POSTGRES_USER: ${DB_USERNAME:-test}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-test}
      POSTGRES_DB: ${DB_DATABASE:-ext_app}
    volumes:
      - ./docker-compose/postgres:/var/lib/postgresql/data
    networks:
      - ext_net


  nginx:
    image: nginx:alpine
    container_name: ext_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./laravel:/var/www
      - ./nginx/conf:/etc/nginx/conf.d
    networks:
      - ext_net

  python:
    build:
      context: ./docker-compose/python
      dockerfile: Dockerfile
    container_name: ext_python
    restart: unless-stopped
    ports:
      - "8001:8000"
    env_file:
      - ./docker-compose/python/env/.env
    # Dev: live code reload. Save a .py file under docker-compose/python/ai/ ->
    # uvicorn reloads in ~1-2s (models stay cached across reloads because the
    # lifespan is empty; the first request after a save lazy-loads the model).
    command: >-
      uvicorn ai.main:app --host 0.0.0.0 --port 8000
      --reload --reload-dir /app/ai
    volumes:
      # Live source code (mirror the Laravel bind-mount pattern).
      - type: bind
        source: ./docker-compose/python/ai
        target: /app/ai
        consistency: cached
      # Model weights: named Docker volume. Survives recreates; not in git.
      # Download models via /app/scripts/download_model.py.
      - ai_models:/app/models
      # Live .env: bind-mount the directory (not the single file — single-file
      # mounts break on sed -i / editor inodes). config.py re-reads /app/env/.env
      # per request, so edits to threshold/window/model paths apply instantly
      # with no recreate or restart.
      - ./docker-compose/python/env:/app/env:ro
      # Helper scripts (download_model.py, etc.); read-only.
      - ./docker-compose/python/scripts:/app/scripts:ro
    networks:
      - ext_net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ext_cloudflared
    command: tunnel --no-autoupdate run
    env_file:
      - ./docker-compose/cloudflare/.env
    depends_on:
      - nginx
    restart: unless-stopped
    networks:
      - ext_net

networks:
  ext_net:
    driver: bridge

volumes:
  ai_models:
